<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Gonçalo - App Interativa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body, html{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f5f7;color:#333;}
.app{max-width:420px;margin:auto;padding:15px;}
.header{background:#d71c1c;color:white;padding:35px 25px;border-radius:30px;text-align:center;margin-bottom:20px;box-shadow:0 5px 25px rgba(0,0,0,0.25);}
.header h1{font-size:28px;font-weight:700;text-shadow:1px 1px 2px rgba(0,0,0,0.2);}
.header p{margin-top:6px;font-size:16px;opacity:0.9;}
.tabs{display:flex;justify-content:space-around;margin-bottom:15px;flex-wrap:wrap;}
.tab-button{padding:10px 12px;border:none;border-radius:12px;background:#ddd;cursor:pointer;font-weight:600;transition:all 0.3s;margin:3px;}
.tab-button.active{background:#d71c1c;color:white;}
.card{border-radius:22px;padding:18px 20px;margin-bottom:15px;box-shadow:0 5px 18px rgba(0,0,0,0.1);position:relative;transition:all 0.3s;}
.total-card{background:linear-gradient(135deg,#d71c1c,#a80000);color:white;text-align:center;animation:pulse 2s infinite;}
.total-card h2{font-size:32px;font-weight:700;margin-top:8px;}
.card.small{display:flex;justify-content:space-between;padding:14px 18px;background:white;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,0.06);margin-bottom:12px;}
.card.small span{font-size:14px;font-weight:500;color:#333;}
.card.small strong{font-size:16px;font-weight:600;color:#d71c1c;}
.list h3{margin-bottom:12px;font-size:20px;color:#d71c1c;font-weight:600;}
.item{display:flex;justify-content:space-between;align-items:center;background:white;padding:14px 18px;border-radius:18px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);position:relative;}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.item span{font-size:16px;font-weight:500;}
.item input{width:90px;text-align:right;border:none;font-size:16px;font-weight:600;border-radius:8px;padding:5px;transition:all 0.2s;background:#f9f9f9;}
.item input:focus{outline:none;background:#fff;box-shadow:0 0 5px rgba(0,0,0,0.15);}
.divider{height:1px;background:#eee;margin:15px 0;}
.positivo input{color:green;}
.negativo input{color:red;}
@keyframes pulse{0%{box-shadow:0 0 0 rgba(215,28,28,0.4);}70%{box-shadow:0 0 20px rgba(215,28,28,0.4);}100%{box-shadow:0 0 0 rgba(215,28,28,0.4);}}
#grafico-container{background:white;padding:15px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,0.06);margin-top:20px;}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <h1>Olá Gonçalo!</h1>
    <p>Bem-vindo ao seu Banco</p>
  </header>

  <!-- ABAS PRINCIPAIS -->
  <div class="tabs">
    <button class="tab-button active" onclick="abrirAba('saldos')">Saldos</button>
    <button class="tab-button" onclick="abrirAba('movimentos')">Movimentos</button>
    <button class="tab-button" onclick="abrirAba('planeamento')">Planeamento</button>
  </div>

  <!-- ABA SALDOS -->
  <div id="saldos" class="tab-content">
    <section class="card total-card">
      <span>Total geral</span>
      <h2>€ <span id="total">0.00</span></h2>
    </section>
    <section class="card small"><span>Sem moedas</span><strong>€ <span id="sem-moedas">0.00</span></strong></section>
    <section class="card small"><span>Sem moedas e sem cartão</span><strong>€ <span id="sem-moedas-cartao">0.00</span></strong></section>
    <div class="divider"></div>
    <section class="list" id="lista-saldos">
      <h3>Saldos</h3>
    </section>
    <div id="grafico-container">
      <canvas id="saldoGrafico" width="400" height="200"></canvas>
    </div>
  </div>
    <!-- ABA MOVIMENTOS -->
  <div id="movimentos" class="tab-content" style="display:none;">
    <button onclick="mostrarFormMovimento()" style="margin-bottom:12px;">+ Adicionar Movimento</button>
    <div id="sub-abas-meses" style="margin:12px 0;"></div>
    <div id="lista-movimentos-mensal"></div>
  </div>

<script>
// ================== ABAS ==================
function abrirAba(id){
  const tabs = document.querySelectorAll('.tab-content');
  tabs.forEach(tab => tab.style.display='none');
  document.getElementById(id).style.display='block';

  const buttons = document.querySelectorAll('.tab-button');
  buttons.forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

// ================== SALDOS ==================
let valoresAbas = {
  "Ibiza":245,
  "Dela":4010,
  "Money 2026":2775,
  "Notas de 5 (capa)":100,
  "Capa 1 (azul)":50,
  "Capa 2 (caixa Apple)":55,
  "Porta cartões":25,
  "Capa 3 (preta MagSafe)":50,
  "Cartão":19.62,
  "Capa 4 (iPhone 13)":60,
  "Capa 5 (azul)":15,
  "Capa Apple Azul Escura":0,
  "Moedas carteira":131.92
};

// Carregar saldos do localStorage
const salvosLS = localStorage.getItem('valoresAbas');
if(salvosLS) valoresAbas = JSON.parse(salvosLS);

// ================== FUNÇÕES SALDOS ==================
function atualizarSaldosLista(){
  const lista = document.getElementById('lista-saldos');
  lista.innerHTML='';
  for(const nome in valoresAbas){
    const valor = valoresAbas[nome];
    const div = document.createElement('div');
    div.className='item';
    if(nome==="Capa Apple Azul Escura"){
      // Input apenas valor
      div.innerHTML = `<span>${nome}</span>
        <input type="number" value="${valor}" data-nome="${nome}" oninput="alterarSaldo(this)">`;
    }else{
      div.innerHTML = `<span>${nome}</span>
        <input type="number" value="${valor}" data-nome="${nome}" oninput="alterarSaldo(this)">`;
    }
    lista.appendChild(div);
  }
  atualizarTotais();
  atualizarGrafico();
}

function alterarSaldo(input){
  const nome = input.dataset.nome;
  valoresAbas[nome] = parseFloat(input.value)||0;
  atualizarTotais();
  atualizarGrafico();
  atualizarSaldosLista();
  localStorage.setItem('valoresAbas', JSON.stringify(valoresAbas));
}

function atualizarTotais(){
  let total=0, semMoedas=0, semCartao=0;
  for(const nome in valoresAbas){
    total += valoresAbas[nome];
    if(nome!=="Moedas carteira") semMoedas+=valoresAbas[nome];
    if(nome!=="Moedas carteira" && nome!=="Cartão") semCartao+=valoresAbas[nome];
  }
  document.getElementById('total').textContent=total.toFixed(2);
  document.getElementById('sem-moedas').textContent=semMoedas.toFixed(2);
  document.getElementById('sem-moedas-cartao').textContent=semCartao.toFixed(2);
}

// ================== GRÁFICO ==================
let saldoGrafico;
function atualizarGrafico(){
  const ctx = document.getElementById('saldoGrafico').getContext('2d');
  const labels = Object.keys(valoresAbas);
  const data = Object.values(valoresAbas);
  if(saldoGrafico) saldoGrafico.destroy();
  saldoGrafico = new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[{label:'Saldo (€)',data:data,backgroundColor:'rgba(215,28,28,0.7)'}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

// ================== MOVIMENTOS ==================
let abasExtras = ["Avô","Pais"];
let movimentos = {};
const movSalvos = localStorage.getItem('movimentos');
if(movSalvos) movimentos = JSON.parse(movSalvos);

function mostrarFormMovimento(){
  const form = document.getElementById('novo-movimento');
  if(!form){
    const container = document.getElementById('movimentos');
    const htmlForm = document.createElement('div');
    htmlForm.id='novo-movimento';
    htmlForm.style.padding='12px';
    htmlForm.innerHTML=`
      <h3>Adicionar Movimento</h3>
      <label>Tipo:
        <select id="tipo-movimento"><option value="ganho">Ganho</option><option value="gasto">Gasto</option></select>
      </label><br><br>
      <label>Valor (€): <input type="number" id="valor-movimento"></label><br><br>
      <label>Aba:
        <select id="aba-movimento"></select>
      </label><br><br>
      <label>Descrição: <input type="text" id="descricao-movimento"></label><br><br>
      <label>Data: <input type="date" id="data-movimento"></label><br><br>
      <button onclick="adicionarMovimento()">Adicionar</button>
    `;
    container.appendChild(htmlForm);
  }
  atualizarSelectAbas();
  form.style.display=form.style.display==='block'?'none':'block';
}

function atualizarSelectAbas(){
  const select = document.getElementById('aba-movimento');
  select.innerHTML='';
  for(const nome in valoresAbas){
    const opt = document.createElement('option'); opt.value=nome; opt.textContent=nome; select.appendChild(opt);
  }
  abasExtras.forEach(nome=>{ const opt = document.createElement('option'); opt.value=nome; opt.textContent=nome; select.appendChild(opt); });
}

function adicionarMovimento(){
  const tipo = document.getElementById('tipo-movimento').value;
  const valor = parseFloat(document.getElementById('valor-movimento').value)||0;
  const aba = document.getElementById('aba-movimento').value;
  const desc = document.getElementById('descricao-movimento').value;
  let data = document.getElementById('data-movimento').value;
  if(!data) data=new Date().toISOString().split('T')[0];
  if(valor<=0 || !aba){ alert('Preencha todos os campos'); return; }

  if(valoresAbas[aba]!==undefined){ valoresAbas[aba]+=(tipo==='ganho'?valor:-valor); atualizarTotais(); atualizarGrafico(); atualizarSaldosLista(); }

  const mesAno = data.slice(0,7);
  if(!movimentos[mesAno]) movimentos[mesAno]=[];
  movimentos[mesAno].push({tipo,tipoValor:(tipo==='gasto'? -valor:valor),valor,aba,desc,data});
  localStorage.setItem('movimentos', JSON.stringify(movimentos));

  atualizarSubAbasMensais();
  mostrarMovimentosMes(mesAno);

  document.getElementById('valor-movimento').value='';
  document.getElementById('descricao-movimento').value='';
}

function atualizarSubAbasMensais(){
  let container = document.getElementById('sub-abas-meses');
  container.innerHTML='';
  Object.keys(movimentos).sort().forEach(mesAno=>{
    const btn=document.createElement('button'); btn.textContent=mesAno; btn.className='tab-button'; btn.onclick=()=>mostrarMovimentosMes(mesAno); container.appendChild(btn);
  });
}

function mostrarMovimentosMes(mesAno){
  let container = document.getElementById('lista-movimentos-mensal');
  container.innerHTML=`<h4>Movimentos de ${mesAno}</h4>`;
  if(!movimentos[mesAno] || movimentos[mesAno].length===0){ container.innerHTML+='<p>Nenhum movimento neste mês.</p>'; return; }
  movimentos[mesAno].forEach(m=>{
    const div=document.createElement('div'); div.className='item '+(m.tipo==='gasto'?'negativo':'positivo'); div.innerHTML=`<span>${m.data} - ${m.aba} - ${m.desc}</span><input type="text" value="${m.tipoValor.toFixed(2)} €" readonly>`; container.appendChild(div);
  });
}
    <!-- ABA PLANEAMENTO -->
  <div id="planeamento" class="tab-content" style="display:none;">
    <div id="abas-planeamento" style="margin-bottom:15px;"></div>
    <div id="conteudo-planeamento"></div>
  </div>

<script>
// ================== PLANEAMENTO FINANCEIRO ==================
const planeamentoData = {
  "Money 2026":{
    "Janeiro":{Entradas:60,Gastos:120,Saldo:2835},
    "Fevereiro":{Entradas:50,Gastos:0,Saldo:2885},
    "Março":{Entradas:50,Gastos:0,Saldo:2935},
    "Abril":{Entradas:60,Gastos:70,Saldo:2925},
    "Maio":{Entradas:50,Gastos:0,Saldo:2975},
    "Junho":{Entradas:350,Gastos:80,Saldo:3245},
    "Julho":{Entradas:60,Gastos:90,Saldo:3215},
    "Agosto":{Entradas:60,Gastos:90,Saldo:3185},
    "Setembro":{Entradas:50,Gastos:70,Saldo:3165},
    "Outubro":{Entradas:50,Gastos:0,Saldo:3215},
    "Novembro":{Entradas:50,Gastos:0,Saldo:3265},
    "Dezembro":{Entradas:600,Gastos:120,Saldo:3745}
  },
  "Dela":{
    "Janeiro":{Entradas:0,Gastos:0,Saldo:4010},
    "Fevereiro":{Entradas:0,Gastos:0,Saldo:4010},
    "Março":{Entradas:0,Gastos:0,Saldo:4010},
    "Abril":{Entradas:0,Gastos:70,Saldo:3940},
    "Maio":{Entradas:0,Gastos:0,Saldo:3940},
    "Junho":{Entradas:0,Gastos:60,Saldo:3880},
    "Julho":{Entradas:0,Gastos:90,Saldo:3790},
    "Agosto":{Entradas:0,Gastos:90,Saldo:3700},
    "Setembro":{Entradas:0,Gastos:50,Saldo:3650},
    "Outubro":{Entradas:0,Gastos:0,Saldo:3650},
    "Novembro":{Entradas:0,Gastos:0,Saldo:3650},
    "Dezembro":{Entradas:0,Gastos:120,Saldo:3530}
  }
};

function carregarPlaneamentoAbas(){
  const container = document.getElementById('abas-planeamento');
  container.innerHTML='';
  const nomesAbas = Object.keys(planeamentoData);
  nomesAbas.forEach(nome=>{
    const btn=document.createElement('button'); btn.className='tab-button'; btn.textContent=nome;
    btn.onclick=()=> mostrarPlaneamento(nome);
    container.appendChild(btn);
  });
  // Inicializa primeira aba
  mostrarPlaneamento(nomesAbas[0]);
}

function mostrarPlaneamento(nome){
  const conteudo = document.getElementById('conteudo-planeamento');
  conteudo.innerHTML='';
  const tabela = document.createElement('table');
  tabela.style.width='100%';
  tabela.style.borderCollapse='collapse';
  tabela.innerHTML='<tr><th>Mês</th><th>Entradas (€)</th><th>Gastos (€)</th><th>Saldo (€)</th></tr>';
  const meses = planeamentoData[nome];
  for(const mes in meses){
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="padding:8px;border-bottom:1px solid #eee">${mes}</td>
      <td style="padding:8px;border-bottom:1px solid #eee">${meses[mes].Entradas}</td>
      <td style="padding:8px;border-bottom:1px solid #eee">${meses[mes].Gastos}</td>
      <td style="padding:8px;border-bottom:1px solid #eee">${meses[mes].Saldo}</td>`;
    tabela.appendChild(tr);
  }
  conteudo.appendChild(tabela);
}

// ================== INICIALIZAÇÃO ==================
function inicializarApp(){
  // Saldos
  const salvos = localStorage.getItem('valoresAbas');
  if(salvos) valoresAbas = JSON.parse(salvos);
  atualizarSaldosLista();
  atualizarSubAbasMensais();
  mostrarMovimentosMes(new Date().toISOString().slice(0,7));
  carregarPlaneamentoAbas();
}

window.onload=inicializarApp;
</script>

</div>
</body>
</html>
