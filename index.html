<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Gonçalo - App Avançada</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body, html{font-family:'Helvetica Neue', Arial,sans-serif;background:#f5f5f7;color:#333;}
.app{max-width:420px;margin:auto;padding:15px;}
.header{background:#d71c1c;color:white;padding:35px 25px;border-radius:30px;text-align:center;margin-bottom:20px;box-shadow:0 5px 25px rgba(0,0,0,0.25);}
.header h1{font-size:28px;font-weight:700;text-shadow:1px 1px 2px rgba(0,0,0,0.2);}
.header p{margin-top:6px;font-size:16px;opacity:0.9;}
.tabs{display:flex;justify-content:space-around;margin-bottom:15px;flex-wrap:wrap;}
.tab-button{padding:10px 12px;border:none;border-radius:12px;background:#ddd;cursor:pointer;font-weight:600;transition:all 0.3s;margin:3px;}
.tab-button.active{background:#d71c1c;color:white;}
.card{border-radius:22px;padding:18px 20px;margin-bottom:15px;box-shadow:0 5px 18px rgba(0,0,0,0.1);position:relative;transition:all 0.3s;}
.total-card{background:linear-gradient(135deg,#d71c1c,#a80000);color:white;text-align:center;animation:pulse 2s infinite;}
.total-card h2{font-size:32px;font-weight:700;margin-top:8px;}
.card.small{display:flex;justify-content:space-between;padding:14px 18px;background:white;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,0.06);margin-bottom:12px;}
.card.small span{font-size:14px;font-weight:500;color:#333;}
.card.small strong{font-size:16px;font-weight:600;color:#d71c1c;}
.list h3{margin-bottom:12px;font-size:20px;color:#d71c1c;font-weight:600;}
.item{display:flex;justify-content:space-between;align-items:center;background:white;padding:14px 18px;border-radius:18px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);position:relative;}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.item span{font-size:16px;font-weight:500;}
.item input{width:90px;text-align:right;border:none;font-size:16px;font-weight:600;border-radius:8px;padding:5px;transition:all 0.2s;background:#f9f9f9;}
.item input:focus{outline:none;background:#fff;box-shadow:0 0 5px rgba(0,0,0,0.15);}
.divider{height:1px;background:#eee;margin:15px 0;}
@keyframes pulse{0%{box-shadow:0 0 0 rgba(215,28,28,0.4);}70%{box-shadow:0 0 20px rgba(215,28,28,0.4);}100%{box-shadow:0 0 0 rgba(215,28,28,0.4);}}
@media screen and (max-width:450px){.app{padding:10px;}.item input{width:75px;font-size:14px;}}
.item.positivo input{color:green;}
.item.negativo input{color:red;}
#grafico-container{background:white;padding:15px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,0.06);margin-top:20px;}
.add-button{background:#d71c1c;color:white;border:none;padding:8px 12px;border-radius:12px;font-weight:600;cursor:pointer;margin:10px 0;transition:0.3s;}
.add-button:hover{background:#a80000;}
#novo-movimento{display:none;background:white;padding:15px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,0.1);margin-bottom:15px;}
#novo-movimento input,#novo-movimento select,#novo-movimento textarea{margin-bottom:8px;padding:5px;width:100%;border-radius:8px;border:1px solid #ccc;}
#novo-movimento label{font-weight:600;font-size:14px;display:block;margin-top:5px;}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <h1>Olá Gonçalo!</h1>
    <p>Bem-vindo ao seu Banco</p>
  </header>

  <!-- ABAS -->
  <div class="tabs">
    <button class="tab-button active" onclick="abrirAba('saldos')">Saldos</button>
    <button class="tab-button" onclick="abrirAba('movimentos')">Movimentos</button>
    <button class="tab-button" onclick="abrirAba('planeamento')">Planeamento</button>
  </div>

  <!-- ABA SALDOS -->
  <div id="saldos" class="tab-content">
    <!-- TOTAL GERAL -->
    <section class="card total-card">
      <span>Total geral</span>
      <h2>€ <span id="total">0.00</span></h2>
    </section>

    <!-- TOTAIS SECUNDÁRIOS -->
    <section class="card small"><span>Sem moedas</span><strong>€ <span id="sem-moedas">0.00</span></strong></section>
    <section class="card small"><span>Sem moedas e sem cartão</span><strong>€ <span id="sem-moedas-cartao">0.00</span></strong></section>

    <div class="divider"></div>

    <!-- LISTA DE SALDOS -->
    <section class="list" id="lista-saldos">
      <h3>Saldos</h3>
    </section>

    <!-- GRÁFICO -->
    <div id="grafico-container">
      <canvas id="saldoGrafico" width="400" height="200"></canvas>
    </div>
  </div>

  <!-- ABA MOVIMENTOS -->
  <div id="movimentos" class="tab-content" style="display:none;">
    <h3>Movimentos</h3>
    <button class="add-button" onclick="mostrarFormMovimento()">+ Adicionar Movimento</button>
    
    <div id="novo-movimento">
      <label>Tipo</label>
      <select id="tipo-movimento">
        <option value="ganho">Ganho</option>
        <option value="gasto">Gasto</option>
      </select>
      <label>Valor (€)</label>
      <input type="number" id="valor-movimento" placeholder="Ex: 50">
      <label>Conta/Aba</label>
      <select id="aba-movimento"></select>
      <label>Descrição</label>
      <input type="text" id="descricao-movimento" placeholder="Ex: Compra supermercado">
      <label>Data</label>
      <input type="date" id="data-movimento">
      <button class="add-button" onclick="adicionarMovimento()">Adicionar</button>
    </div>

    <!-- Lista de Movimentos -->
    <div id="lista-movimentos-mensal"></div>
  </div>

  <!-- ABA PLANEAMENTO -->
  <div id="planeamento" class="tab-content" style="display:none;">
    <h3>Planeamento Financeiro 2026</h3>
    <div id="sub-abas-planeamento" style="margin-bottom:10px;">
      <button class="add-button" onclick="mostrarPlaneamento('Money 2026')">Money 2026</button>
      <button class="add-button" onclick="mostrarPlaneamento('Dela')">Dela</button>
    </div>
    <div id="tabela-planeamento" style="margin-top:15px;"></div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ================== DADOS INICIAIS ==================
let abas = {
  "Ibiza":245,
  "Dela":4010,
  "Money 2026":2775,
  "Notas de 5 (capa)":100,
  "Capa 1 (azul)":50,
  "Capa 2 (caixa Apple)":55,
  "Porta cartões":25,
  "Capa 3 (preta MagSafe)":50,
  "Cartão":19.62,
  "Capa 4 (iPhone 13)":60,
  "Capa 5 (azul)":15,
  "Nova Capa":0,           // ← Nova aba adicionada
  "Moedas carteira":131.92
};

// Movimentos armazenados por mês/ano
let movimentos = {}; // Ex: {'2026-01':[ {tipo:'gasto',valor:50,aba:'Ibiza',desc:'Supermercado',data:'2026-01-10'} ] }

// ================== ABAS ==================
function abrirAba(id){
  const tabContents = document.querySelectorAll('.tab-content');
  tabContents.forEach(tc => tc.style.display='none');
  document.getElementById(id).style.display='block';

  const tabButtons = document.querySelectorAll('.tab-button');
  tabButtons.forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

// ================== LISTA DE SALDOS ==================
function atualizarSaldosLista(){
  const lista = document.getElementById('lista-saldos');
  lista.innerHTML=''; // limpa lista

  for(const nome in abas){
    const valor = abas[nome];
    const div = document.createElement('div');
    div.className='item';
    div.innerHTML = `<span>${nome}</span><input type="number" value="${valor}" data-nome="${nome}" oninput="atualizarSaldo(this)">`;
    lista.appendChild(div);
  }

  // Atualiza select de movimentos
  const selectAba = document.getElementById('aba-movimento');
  selectAba.innerHTML='';
  for(const nome in abas){
    const option = document.createElement('option');
    option.value=nome;
    option.textContent=nome;
    selectAba.appendChild(option);
  }

  atualizarTotais();
}

// ================== ATUALIZAÇÃO SALDO ==================
function atualizarSaldo(input){
  const nome = input.dataset.nome;
  abas[nome] = parseFloat(input.value) || 0;
  atualizarTotais();
  atualizarGrafico();
}

// ================== CALCULO TOTAIS ==================
function atualizarTotais(){
  let total=0, semMoedas=0, semCartao=0;
  for(const nome in abas){
    total += abas[nome];
    if(nome!=="Moedas carteira") semMoedas += abas[nome];
    if(nome!=="Moedas carteira" && nome!=="Cartão") semCartao += abas[nome];
  }
  document.getElementById('total').textContent = total.toFixed(2);
  document.getElementById('sem-moedas').textContent = semMoedas.toFixed(2);
  document.getElementById('sem-moedas-cartao').textContent = semCartao.toFixed(2);
}

// ================== GRÁFICO ==================
let saldoGrafico;
function atualizarGrafico(){
  const ctx = document.getElementById('saldoGrafico').getContext('2d');
  const labels = Object.keys(abas);
  const data = Object.values(abas);

  if(saldoGrafico) saldoGrafico.destroy();

  saldoGrafico = new Chart(ctx,{
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label:'Saldo por Aba (€)',
        data:data,
        backgroundColor:'rgba(215,28,28,0.7)'
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true}}
    }
  });
}

// ================== MOVIMENTOS ==================
function mostrarFormMovimento(){
  const form = document.getElementById('novo-movimento');
  form.style.display = form.style.display==='none' ? 'block' : 'none';
}

// ================== INICIALIZAÇÃO ==================
atualizarSaldosLista();
atualizarGrafico();
</script>
  <script>
// ================== ADICIONAR MOVIMENTO ==================
function adicionarMovimento(){
  const tipo = document.getElementById('tipo-movimento').value;
  const valor = parseFloat(document.getElementById('valor-movimento').value) || 0;
  const aba = document.getElementById('aba-movimento').value;
  const desc = document.getElementById('descricao-movimento').value;
  const data = document.getElementById('data-movimento').value;

  if(valor <=0 || !aba || !data){alert('Preencha todos os campos corretamente'); return;}

  // Atualiza saldo automaticamente
  if(tipo==='gasto') abas[aba]-=valor;
  else abas[aba]+=valor;

  // Atualiza totais e gráfico
  atualizarTotais();
  atualizarGrafico();

  // Guarda movimento
  const mesAno = data.slice(0,7); // "YYYY-MM"
  if(!movimentos[mesAno]) movimentos[mesAno]=[];
  movimentos[mesAno].push({tipo,tipoValor:(tipo==='gasto'? -valor:valor),valor,aba,desc,data});

  // Atualiza lista
  mostrarMovimentosMes(mesAno);

  // Limpa form
  document.getElementById('valor-movimento').value='';
  document.getElementById('descricao-movimento').value='';
  document.getElementById('novo-movimento').style.display='none';
}

// ================== MOSTRAR MOVIMENTOS DO MÊS ==================
function mostrarMovimentosMes(mesAno){
  const container = document.getElementById('lista-movimentos-mensal');
  container.innerHTML = `<h4>Movimentos de ${mesAno}</h4>`;
  if(!movimentos[mesAno] || movimentos[mesAno].length===0){
    container.innerHTML += '<p>Nenhum movimento neste mês.</p>';
    return;
  }

  movimentos[mesAno].forEach(m=>{
    const div = document.createElement('div');
    div.className = 'item ' + (m.tipo==='gasto'?'negativo':'positivo');
    div.innerHTML = `<span>${m.data} - ${m.aba} - ${m.desc}</span>
                     <input type="text" value="${m.tipoValor.toFixed(2)} €" readonly>`;
    container.appendChild(div);
  });
}

// ================== PLANEAMENTO FINANCEIRO ==================
const planeamentoData = {
  "Money 2026":[
    {mes:'Janeiro',entradas:60,gastos:120,saldo:2835},
    {mes:'Fevereiro',entradas:50,gastos:0,saldo:2885},
    {mes:'Março',entradas:50,gastos:0,saldo:2935},
    {mes:'Abril',entradas:60,gastos:70,saldo:2925},
    {mes:'Maio',entradas:50,gastos:0,saldo:2975},
    {mes:'Junho',entradas:350,gastos:80,saldo:3245},
    {mes:'Julho',entradas:60,gastos:90,saldo:3215},
    {mes:'Agosto',entradas:60,gastos:90,saldo:3185},
    {mes:'Setembro',entradas:50,gastos:70,saldo:3165},
    {mes:'Outubro',entradas:50,gastos:0,saldo:3215},
    {mes:'Novembro',entradas:50,gastos:0,saldo:3265},
    {mes:'Dezembro',entradas:600,gastos:120,saldo:3745}
  ],
  "Dela":[
    {mes:'Janeiro',entradas:0,gastos:0,saldo:4010},
    {mes:'Fevereiro',entradas:0,gastos:0,saldo:4010},
    {mes:'Março',entradas:0,gastos:0,saldo:4010},
    {mes:'Abril',entradas:0,gastos:70,saldo:3940},
    {mes:'Maio',entradas:0,gastos:0,saldo:3940},
    {mes:'Junho',entradas:0,gastos:60,saldo:3880},
    {mes:'Julho',entradas:0,gastos:90,saldo:3790},
    {mes:'Agosto',entradas:0,gastos:90,saldo:3700},
    {mes:'Setembro',entradas:0,gastos:50,saldo:3650},
    {mes:'Outubro',entradas:0,gastos:0,saldo:3650},
    {mes:'Novembro',entradas:0,gastos:0,saldo:3650},
    {mes:'Dezembro',entradas:0,gastos:120,saldo:3530}
  ]
};

function mostrarPlaneamento(aba){
  const container = document.getElementById('tabela-planeamento');
  container.innerHTML=''; // limpa tabela

  const tabela = document.createElement('table');
  tabela.style.width='100%';
  tabela.style.borderCollapse='collapse';

  // Cabeçalho
  const cab = document.createElement('tr');
  ['Mês','Entradas (€)','Gastos (€)','Saldo (€)'].forEach(t=>{
    const th = document.createElement('th');
    th.textContent=t;
    th.style.borderBottom='2px solid #d71c1c';
    th.style.padding='6px 8px';
    th.style.textAlign='left';
    tabela.appendChild(th);
  });
  tabela.appendChild(cab);

  // Linhas
  planeamentoData[aba].forEach(m=>{
    const tr = document.createElement('tr');
    [m.mes,m.entradas,m.gastos,m.saldo].forEach(v=>{
      const td = document.createElement('td');
      td.textContent=v;
      td.style.padding='6px 8px';
      tr.appendChild(td);
    });
    tabela.appendChild(tr);
  });

  container.appendChild(tabela);
}

// ================== INICIALIZAÇÃO ==================
atualizarSaldosLista();
atualizarGrafico();
</script>
</body>
</html>
