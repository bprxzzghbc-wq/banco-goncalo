<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Gonçalo</title>
<style>
/* Reset básico */
body, html {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #f1f1f5;
}

/* Container principal */
.app {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

/* Header estilo Nubank */
.header {
  background: #820ad1;
  color: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 5px 0 0 0;
  font-size: 14px;
  opacity: 0.8;
}

/* Cartões de totais */
.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.total-card {
  background: linear-gradient(135deg, #820ad1, #a45de9);
  color: white;
  text-align: center;
}

.total-card h2 {
  margin: 10px 0 0 0;
  font-size: 28px;
}

.card.small {
  display: flex;
  justify-content: space-between;
  padding: 10px 15px;
}

.card.small span {
  font-size: 14px;
  color: #666;
}

/* Lista de saldos */
.list h3 {
  margin-bottom: 10px;
  font-size: 18px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.item span {
  font-size: 14px;
}

.item input {
  width: 100px;
  text-align: right;
  border: none;
  font-size: 14px;
}

.item input:focus {
  outline: none;
}

.moedas {
  background: #fef3c7;
}

.cartao {
  background: #e0f2fe;
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>Banco Gonçalo</h1>
    <p>Resumo financeiro</p>
  </header>

  <section class="card total-card">
    <span>Total geral</span>
    <h2>€ <span id="total">0.00</span></h2>
  </section>

  <section class="card small">
    <span>Sem moedas</span>
    <strong>€ <span id="sem-moedas">0.00</span></strong>
  </section>

  <section class="card small">
    <span>Sem moedas e sem cartão</span>
    <strong>€ <span id="sem-moedas-cartao">0.00</span></strong>
  </section>

  <section class="list">
    <h3>Saldos</h3>

    <div class="item"><span>Ibiza</span><input type="number" value="245" data-type="normal"></div>
    <div class="item"><span>Dela</span><input type="number" value="4010" data-type="normal"></div>
    <div class="item"><span>Money 26</span><input type="number" value="2775" data-type="normal"></div>

    <div class="item"><span>Notas de 5 (capa)</span><input type="number" value="100" data-type="normal"></div>
    <div class="item"><span>Capa 1 (azul)</span><input type="number" value="50" data-type="normal"></div>
    <div class="item"><span>Capa 2 (caixa Apple)</span><input type="number" value="55" data-type="normal"></div>
    <div class="item"><span>Porta cartões</span><input type="number" value="25" data-type="normal"></div>
    <div class="item"><span>Capa 3 (preta MagSafe)</span><input type="number" value="50" data-type="normal"></div>

    <div class="item cartao"><span>Cartão</span><input type="number" value="19.62" data-type="cartao"></div>

    <div class="item"><span>Capa 4 (iPhone 13)</span><input type="number" value="60" data-type="normal"></div>
    <div class="item"><span>Capa 5 (azul)</span><input type="number" value="15" data-type="normal"></div>

    <div class="item moedas"><span>Moedas carteira</span><input type="number" value="131.51" data-type="moedas"></div>
  </section>
</div>

<script>
function calcular() {
  let total = 0;
  let semMoedas = 0;
  let semMoedasCartao = 0;

  document.querySelectorAll('.item input').forEach(input => {
    const valor = parseFloat(input.value) || 0;
    const tipo = input.dataset.type;

    total += valor;

    if (tipo !== 'moedas') semMoedas += valor;
    if (tipo !== 'moedas' && tipo !== 'cartao') semMoedasCartao += valor;
  });

  document.getElementById('total').textContent = total.toLocaleString('pt-PT', { minimumFractionDigits: 2 });
  document.getElementById('sem-moedas').textContent = semMoedas.toLocaleString('pt-PT', { minimumFractionDigits: 2 });
  document.getElementById('sem-moedas-cartao').textContent = semMoedasCartao.toLocaleString('pt-PT', { minimumFractionDigits: 2 });
}

// Atualiza ao digitar
document.querySelectorAll('input').forEach(input => input.addEventListener('input', calcular));

// Inicializa
calcular();
</script>

</body>
</html>
