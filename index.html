<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Gonçalo - App Completa</title>
<style>
/* ==================== RESET ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
body, html{font-family:'Helvetica Neue', Arial,sans-serif;background:#f5f5f7;color:#333;transition:all 0.3s;}
.app{max-width:420px;margin:auto;padding:15px;}
.header{background:#d71c1c;color:white;padding:35px 25px;border-radius:30px;text-align:center;margin-bottom:20px;box-shadow:0 5px 25px rgba(0,0,0,0.25);}
.header h1{font-size:28px;font-weight:700;text-shadow:1px 1px 2px rgba(0,0,0,0.2);}
.header p{margin-top:6px;font-size:16px;opacity:0.9;}
.tabs{display:flex;justify-content:space-around;margin-bottom:15px;flex-wrap:wrap;}
.tab-button{padding:10px 12px;border:none;border-radius:12px;background:#ddd;cursor:pointer;font-weight:600;transition:all 0.3s;margin:3px;}
.tab-button.active{background:#d71c1c;color:white;}
.card{border-radius:22px;padding:18px 20px;margin-bottom:15px;box-shadow:0 5px 18px rgba(0,0,0,0.1);position:relative;transition:all 0.3s;}
.total-card{background:linear-gradient(135deg,#d71c1c,#a80000);color:white;text-align:center;animation:pulse 2s infinite;}
.total-card h2{font-size:32px;font-weight:700;margin-top:8px;}
.card.small{display:flex;justify-content:space-between;padding:14px 18px;background:white;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,0.06);margin-bottom:12px;}
.card.small span{font-size:14px;font-weight:500;color:#333;}
.card.small strong{font-size:16px;font-weight:600;color:#d71c1c;}
.list h3{margin-bottom:12px;font-size:20px;color:#d71c1c;font-weight:600;}
.item{display:flex;justify-content:space-between;align-items:center;background:white;padding:14px 18px;border-radius:18px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);position:relative;}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.12);}
.item span{font-size:16px;font-weight:500;}
.item input{width:90px;text-align:right;border:none;font-size:16px;font-weight:600;border-radius:8px;padding:5px;transition:all 0.2s;background:#f9f9f9;}
.item input:focus{outline:none;background:#fff;box-shadow:0 0 5px rgba(0,0,0,0.15);}
.item.positivo input{color:green;}
.item.negativo input{color:red;}
.item button{background:none;border:none;color:#d71c1c;font-size:18px;cursor:pointer;margin-left:8px;}
.divider{height:1px;background:#eee;margin:15px 0;}
@keyframes pulse{0%{box-shadow:0 0 0 rgba(215,28,28,0.4);}70%{box-shadow:0 0 20px rgba(215,28,28,0.4);}100%{box-shadow:0 0 0 rgba(215,28,28,0.4);}}
@media screen and (max-width:450px){.app{padding:10px;}.item input{width:75px;font-size:14px;}}

/* ==================== DARK MODE ==================== */
body.dark{background:#1c1c1c;color:#f5f5f5;}
body.dark .card.small, body.dark .item{background:#2c2c2c;box-shadow:0 4px 14px rgba(0,0,0,0.4);}
body.dark .item input{background:#444;color:#fff;}
body.dark .tab-button.active{background:#a80000;color:white;}
body.dark .divider{background:#555;}
body.dark table{color:#f5f5f5;}
body.dark th{border-bottom:2px solid #a80000;}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <h1>Olá Gonçalo!</h1>
  <p>Bem-vindo ao seu Banco</p>
  <button id="darkToggle" style="margin-top:10px;padding:6px 12px;border:none;border-radius:8px;background:white;color:#d71c1c;font-weight:600;cursor:pointer;">Dark/Light</button>
</header>

<div class="tabs">
  <button class="tab-button active" onclick="abrirAba('saldos', this)">Saldos</button>
  <button class="tab-button" onclick="abrirAba('movimentos', this)">Movimentos</button>
  <button class="tab-button" onclick="abrirAba('planeamento', this)">Planeamento</button>
</div>

<div id="saldos" class="tab-content">
  <section class="card total-card">
    <span>Total Geral Movimentado</span>
    <h2>€ <span id="total">0.00</span></h2>
  </section>
  <section class="card small"><span>Sem moedas</span><strong>€ <span id="sem-moedas">0.00</span></strong></section>
  <section class="card small"><span>Sem moedas e sem cartão</span><strong>€ <span id="sem-moedas-cartao">0.00</span></strong></section>
  <div class="divider"></div>
  <section class="list" id="lista-saldos"><h3>Saldos</h3></section>
  <div id="grafico-container"><canvas id="saldoGrafico" width="400" height="200"></canvas></div>
</div>

<div id="movimentos" class="tab-content" style="display:none;">
  <button class="add-button" onclick="mostrarFormMovimento()">+ Adicionar Movimento</button>
  <div id="novo-movimento" style="display:none;margin-top:10px;">
    <label>Tipo:</label>
    <select id="tipo-movimento">
      <option value="ganho">Ganho</option>
      <option value="gasto">Gasto</option>
    </select>
    <label>Valor (€):</label>
    <input type="number" id="valor-movimento">
    <label>Descrição:</label>
    <input type="text" id="descricao-movimento">
    <label>Aba:</label>
    <select id="aba-movimento"></select>
    <label>Data (opcional):</label>
    <input type="date" id="data-movimento">
    <button class="add-button" onclick="adicionarMovimento()">Salvar Movimento</button>
  </div>
  <div class="divider"></div>
  <div id="resumo-mes" style="margin-bottom:10px;"></div>
  <div class="sub-aba-mes" id="sub-abas-meses"></div>
  <div id="lista-movimentos-mensal"></div>
</div>

<div id="planeamento" class="tab-content" style="display:none;">
  <label>Selecione Aba:</label>
  <select id="planeamento-aba" onchange="mostrarPlaneamento(this.value)">
    <option value="Money 2026">Money 2026</option>
    <option value="Dela">Dela</option>
  </select>
  <div id="tabela-planeamento"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ================== INICIALIZAÇÃO DE DADOS ==================
let abas = JSON.parse(localStorage.getItem('abas')) || {"Ibiza":245,"Dela":4010,"Money 2026":2775,"Notas de 5 (capa)":100,"Capa 1 (azul)":50,"Capa 2 (caixa Apple)":55,"Porta cartões":25,"Capa 3 (preta MagSafe)":50,"Cartão":19.62,"Capa 4 (iPhone 13)":60,"Capa 5 (azul)":15,"Capa Apple Azul Escura":0,"Moedas carteira":131.92};
localStorage.setItem('abas', JSON.stringify(abas));

let movimentos = JSON.parse(localStorage.getItem('movimentos')) || {};
let extrasAbas = ["Avô","Pais"];
let saldoGrafico;

// ================== ABAS ==================
function abrirAba(id, btn){
  document.querySelectorAll('.tab-content').forEach(tab=>tab.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

// ================== DARK MODE ==================
document.getElementById('darkToggle').onclick = ()=>{
  document.body.classList.toggle('dark');
}

// ================== SALDOS ==================
function atualizarTotais(){
  let total=0, semMoedas=0, semCartao=0;
  for(const nome in abas){
    total+=abas[nome];
    if(nome!=="Moedas carteira") semMoedas+=abas[nome];
    if(nome!=="Moedas carteira" && nome!=="Cartão") semCartao+=abas[nome];
  }
  document.getElementById('total').textContent = total.toFixed(2);
  document.getElementById('sem-moedas').textContent = semMoedas.toFixed(2);
  document.getElementById('sem-moedas-cartao').textContent = semCartao.toFixed(2);
  localStorage.setItem('abas',JSON.stringify(abas));
}

function atualizarSaldosLista(){
  const lista=document.getElementById('lista-saldos');
  lista.innerHTML='<h3>Saldos</h3>';
  for(const nome in abas){
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<span>${nome}</span><input type="number" value="${abas[nome]}" data-nome="${nome}" oninput="atualizarSaldo(this)">`;
    lista.appendChild(div);
  }
  atualizarTotais();
  atualizarGrafico();
}

function atualizarSaldo(input){
  const nome=input.dataset.nome;
  abas[nome]=parseFloat(input.value)||0;
  atualizarTotais();
  atualizarGrafico();
  localStorage.setItem('abas', JSON.stringify(abas));
}

function atualizarGrafico(){
  const ctx=document.getElementById('saldoGrafico').getContext('2d');
  const labels=Object.keys(abas);
  const data=Object.values(abas);
  if(saldoGrafico) saldoGrafico.destroy();
  saldoGrafico=new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[{label:'Saldo (€)',data:data,backgroundColor:'rgba(215,28,28,0.7)'}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

// ================== MOVIMENTOS ==================
function mostrarFormMovimento(){
  const f=document.getElementById('novo-movimento');
  f.style.display=f.style.display==='none'?'block':'none';
}

function preencherSelectAbas(){
  const s=document.getElementById('aba-movimento');
  s.innerHTML='';
  Object.keys(abas).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
  extrasAbas.forEach(e=>{let o=document.createElement('option');o.value=e;o.textContent=e;s.appendChild(o);});
}

function adicionarMovimento(){
  const tipo=document.getElementById('tipo-movimento').value;
  const valor=parseFloat(document.getElementById('valor-movimento').value)||0;
  const aba=document.getElementById('aba-movimento').value;
  const desc=document.getElementById('descricao-movimento').value;
  let data=document.getElementById('data-movimento').value||new Date().toISOString().split('T')[0];
  document.getElementById('data-movimento').value=data;

  if(valor<=0||!aba||!desc){alert('Preencha todos os campos!');return;}

  if(!extrasAbas.includes(aba)){
    if(abas[aba]===undefined) abas[aba]=0;
    abas[aba]+=(tipo==='gasto'?-valor:valor);
    atualizarTotais();
    atualizarGrafico();
  }

  const mesAno=data.slice(0,7);
  if(!movimentos[mesAno]) movimentos[mesAno]=[];
  movimentos[mesAno].push({tipo,tipoValor:(tipo==='gasto'?-valor:valor),valor,aba,desc,data});
  localStorage.setItem('movimentos', JSON.stringify(movimentos));

  document.getElementById('valor-movimento').value='';
  document.getElementById('descricao-movimento').value='';
  document.getElementById('data-movimento').value='';

  atualizarSubAbasMensais();
  mostrarMovimentosMes(mesAno);
}

// ================== APAGAR MOVIMENTO ==================
function apagarMovimento(mesAno,index){
  const mov=movimentos[mesAno][index];
  if(!extrasAbas.includes(mov.aba)){
    abas[mov.aba]-=mov.tipoValor;
    atualizarTotais();
    atualizarGrafico();
  }
  movimentos[mesAno].splice(index,1);
  localStorage.setItem('movimentos',JSON.stringify(movimentos));
  mostrarMovimentosMes(mesAno);
}

// ================== SUB ABAS ==================
function atualizarSubAbasMensais(){
  const c=document.getElementById('sub-abas-meses');
  c.innerHTML='';
  Object.keys(movimentos).sort().forEach((m,index)=>{
    const b=document.createElement('button');
    b.textContent=m;
    b.onclick=()=>mostrarMovimentosMes(m);
    if(index===Object.keys(movimentos).length-1) b.classList.add('active');
    c.appendChild(b);
  });
}

function mostrarMovimentosMes(m){
  const c = document.getElementById('lista-movimentos-mensal');
  document.querySelectorAll('#sub-abas-meses button').forEach(b=>b.classList.remove('active'));
  const btn = Array.from(document.querySelectorAll('#sub-abas-meses button')).find(b=>b.textContent===m);
  if(btn) btn.classList.add('active');

  c.innerHTML=`<h4>Movimentos de ${m}</h4>`;
  if(!movimentos[m] || movimentos[m].length===0){c.innerHTML+='<p>Nenhum movimento neste mês.</p>';return;}

  let totalEntradas=0, totalGastos=0;
  movimentos[m].forEach((x,index)=>{
    if(x.tipo==='gasto') totalGastos+=x.valor;
    else totalEntradas+=x.valor;

    const d=document.createElement('div');
    d.className='item '+(x.tipo==='gasto'?'negativo':'positivo');
    d.innerHTML=`<span>${x.data} - ${x.aba} - ${x.desc}</span><input type="text" value="${x.tipoValor.toFixed(2)} €" readonly><button onclick="apagarMovimento('${m}',${index})">🗑️</button>`;
    c.appendChild(d);
  });
  document.getElementById('resumo-mes').innerHTML=`<strong>Entradas:</strong> €${totalEntradas.toFixed(2)} | <strong>Gastos:</strong> €${totalGastos.toFixed(2)} | <strong>Capital Movimentado:</strong> €${(totalEntradas+totalGastos).toFixed(2)}`;
}

// ================== PLANEAMENTO ==================
const planeamentoData={"Money 2026":[{mes:'Janeiro',entradas:60,gastos:120,saldo:2835},{mes:'Fevereiro',entradas:50,gastos:0,saldo:2885},{mes:'Março',entradas:50,gastos:0,saldo:2935},{mes:'Abril',entradas:60,gastos:70,saldo:2925},{mes:'Maio',entradas:50,gastos:0,saldo:2975},{mes:'Junho',entradas:350,gastos:60,saldo:3265},{mes:'Julho',entradas:60,gastos:30,saldo:3295},{mes:'Agosto',entradas:60,gastos:50,saldo:3305},{mes:'Setembro',entradas:60,gastos:110,saldo:3255},{mes:'Outubro',entradas:60,gastos:0,saldo:3315},{mes:'Novembro',entradas:50,gastos:0,saldo:3365},{mes:'Dezembro',entradas:500,gastos:120,saldo:3745}],"Dela":[{mes:'Janeiro',entradas:0,gastos:0,saldo:4010},{mes:'Fevereiro',entradas:0,gastos:0,saldo:4010},{mes:'Março',entradas:0,gastos:0,saldo:4010},{mes:'Abril',entradas:0,gastos:70,saldo:3940},{mes:'Maio',entradas:0,gastos:0,saldo:3940},{mes:'Junho',entradas:0,gastos:40,saldo:3900},{mes:'Julho',entradas:0,gastos:20,saldo:3880},{mes:'Agosto',entradas:0,gastos:0,saldo:3880},{mes:'Setembro',entradas:0,gastos:0,saldo:3880},{mes:'Outubro',entradas:0,gastos:0,saldo:3880},{mes:'Novembro',entradas:0,gastos:0,saldo:3880},{mes:'Dezembro',entradas:0,gastos:0,saldo:3880}]};

function mostrarPlaneamento(aba){
  const div=document.getElementById('tabela-planeamento');
  div.innerHTML='';
  const tabela=document.createElement('table');
  tabela.style.width='100%';
  tabela.style.borderCollapse='collapse';
  let html='<tr><th>Mês</th><th>Entradas (€)</th><th>Gastos (€)</th><th>Saldo (€)</th></tr>';
  planeamentoData[aba].forEach(linha=>{
    html+=`<tr>
      <td>${linha.mes}</td>
      <td>${linha.entradas}</td>
      <td>${linha.gastos}</td>
      <td>${linha.saldo}</td>
    </tr>`;
  });
  tabela.innerHTML=html;
  div.appendChild(tabela);
}

// ================== INICIALIZAÇÃO ==================
preencherSelectAbas();
atualizarSaldosLista();
atualizarSubAbasMensais();

// Mostra o último mês disponível
const meses = Object.keys(movimentos).sort();
if(meses.length>0) mostrarMovimentosMes(meses[meses.length-1]);
</script>
</body>
</html>
