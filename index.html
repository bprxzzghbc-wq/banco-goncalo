<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// ================== INICIALIZAÇÃO DE DADOS ==================
let abas = JSON.parse(localStorage.getItem('abas')) || {
    "Ibiza":245,"Dela":4010,"Money 2026":2775,"Notas de 5 (capa)":100,
    "Capa 1 (azul)":50,"Capa 2 (caixa Apple)":55,"Porta cartões":25,
    "Capa 3 (preta MagSafe)":50,"Cartão":19.62,"Capa 4 (iPhone 13)":60,
    "Capa 5 (azul)":15,"Capa Apple Azul Escura":0,"Moedas carteira":131.92
};
localStorage.setItem('abas', JSON.stringify(abas));

let movimentos = JSON.parse(localStorage.getItem('movimentos')) || {};
let extrasAbas = ["Avô","Pais"];
let saldoGrafico;

// ================== ABAS ==================
function abrirAba(id, btn){
  document.querySelectorAll('.tab-content').forEach(tab=>tab.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

// ================== SALDOS ==================
function atualizarTotais(){
  let total=0, semMoedas=0, semCartao=0;
  for(const nome in abas){
    total+=abas[nome];
    if(nome!=="Moedas carteira") semMoedas+=abas[nome];
    if(nome!=="Moedas carteira" && nome!=="Cartão") semCartao+=abas[nome];
  }
  document.getElementById('total').textContent = total.toFixed(2);
  document.getElementById('sem-moedas').textContent = semMoedas.toFixed(2);
  document.getElementById('sem-moedas-cartao').textContent = semCartao.toFixed(2);
  localStorage.setItem('abas',JSON.stringify(abas));
}

function atualizarSaldosLista(){
  const lista=document.getElementById('lista-saldos');
  lista.innerHTML='<h3>Saldos</h3>';
  for(const nome in abas){
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<span>${nome}</span><input type="number" value="${abas[nome]}" data-nome="${nome}" oninput="atualizarSaldo(this)">`;
    lista.appendChild(div);
  }
  atualizarTotais();
  atualizarGrafico();
}

function atualizarSaldo(input){
  const nome=input.dataset.nome;
  abas[nome]=parseFloat(input.value)||0;
  atualizarTotais();
  atualizarGrafico();
  localStorage.setItem('abas', JSON.stringify(abas));
}

function atualizarGrafico(){
  const ctx=document.getElementById('saldoGrafico').getContext('2d');
  const labels=Object.keys(abas);
  const data=Object.values(abas);
  if(saldoGrafico) saldoGrafico.destroy();
  saldoGrafico=new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[{label:'Saldo (€)',data:data,backgroundColor:'rgba(215,28,28,0.7)'}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

// ================== DARK MODE ==================
function toggleDarkMode(){
  document.body.classList.toggle('dark-mode');
}

// ================== MOVIMENTOS ==================
function mostrarFormMovimento(){
  const f=document.getElementById('novo-movimento');
  f.style.display=f.style.display==='none'?'block':'none';
}

function preencherSelectAbas(){
  const s=document.getElementById('aba-movimento');
  s.innerHTML='';
  Object.keys(abas).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
  extrasAbas.forEach(e=>{let o=document.createElement('option');o.value=e;o.textContent=e;s.appendChild(o);});
}

function adicionarMovimento(){
  const tipo=document.getElementById('tipo-movimento').value;
  const valor=parseFloat(document.getElementById('valor-movimento').value)||0;
  const aba=document.getElementById('aba-movimento').value;
  const desc=document.getElementById('descricao-movimento').value;
  let data=document.getElementById('data-movimento').value||new Date().toISOString().split('T')[0];
  document.getElementById('data-movimento').value=data;

  if(valor<=0||!aba||!desc){alert('Preencha todos os campos!');return;}

  if(!extrasAbas.includes(aba)){
    if(abas[aba]===undefined) abas[aba]=0;
    abas[aba]+=(tipo==='gasto'?-valor:valor);
    atualizarTotais();
    atualizarGrafico();
  }

  const mesAno=data.slice(0,7);
  if(!movimentos[mesAno]) movimentos[mesAno]=[];
  movimentos[mesAno].push({tipo,tipoValor:(tipo==='gasto'?-valor:valor),valor,aba,desc,data});
  localStorage.setItem('movimentos', JSON.stringify(movimentos));

  document.getElementById('valor-movimento').value='';
  document.getElementById('descricao-movimento').value='';
  document.getElementById('data-movimento').value='';

  atualizarSubAbasMensais();
  mostrarMovimentosMes(mesAno);
}

// ================== APAGAR MOVIMENTOS ==================
function apagarMovimento(mesAno, index){
  const m = movimentos[mesAno][index];
  if(!extrasAbas.includes(m.aba)){
    abas[m.aba]-=m.tipoValor;
    atualizarTotais();
    atualizarGrafico();
  }
  movimentos[mesAno].splice(index,1);
  if(movimentos[mesAno].length===0) delete movimentos[mesAno];
  localStorage.setItem('movimentos',JSON.stringify(movimentos));
  atualizarSubAbasMensais();
  mostrarMovimentosMes(mesAno);
}

// ================== SUB ABAS ==================
function atualizarSubAbasMensais(){
  const c=document.getElementById('sub-abas-meses');
  c.innerHTML='';
  Object.keys(movimentos).sort().forEach((m,index)=>{
    const b=document.createElement('button');
    b.textContent=m;
    b.onclick=()=>mostrarMovimentosMes(m);
    if(index===Object.keys(movimentos).length-1) b.classList.add('active');
    c.appendChild(b);
  });
}

function mostrarMovimentosMes(m){
  const c = document.getElementById('lista-movimentos-mensal');
  const r = document.getElementById('resumo-mensal');
  document.querySelectorAll('#sub-abas-meses button').forEach(b=>b.classList.remove('active'));
  const btn = Array.from(document.querySelectorAll('#sub-abas-meses button')).find(b=>b.textContent===m);
  if(btn) btn.classList.add('active');

  if(!movimentos[m] || movimentos[m].length===0){c.innerHTML='<p>Nenhum movimento neste mês.</p>'; r.innerHTML=''; return;}

  // RESUMO MENSAL
  let entradas=0, saidas=0;
  movimentos[m].forEach(x=>{
    if(x.tipo==='ganho') entradas+=x.valor;
    else saidas+=x.valor;
  });
  let fluxo=entradas+saidas;
  r.innerHTML=`<div class="card small">Entradas: €${entradas.toFixed(2)} | Saídas: €${saidas.toFixed(2)} | Todo o Dinheiro do Mês: €${fluxo.toFixed(2)}</div>`;

  c.innerHTML=`<h4>Movimentos de ${m}</h4>`;
  movimentos[m].forEach((x,i)=>{
    const d=document.createElement('div');
    d.className='item '+(x.tipo==='gasto'?'negativo':'positivo');
    d.innerHTML=`<span>${x.data} - ${x.aba} - ${x.desc}</span>
                   <input type="text" value="${x.tipoValor.toFixed(2)} €" readonly>
                   <button class="delete-btn" onclick="apagarMovimento('${m}',${i})">🗑️</button>`;
    c.appendChild(d);
  });
}

// ================== PLANEAMENTO ==================
const planeamentoData={"Money 2026":[{mes:'Janeiro',entradas:60,gastos:120,saldo:2835},{mes:'Fevereiro',entradas:50,gastos:0,saldo:2885},{mes:'Março',entradas:50,gastos:0,saldo:2935},{mes:'Abril',entradas:60,gastos:70,saldo:2925},{mes:'Maio',entradas:50,gastos:0,saldo:2975},{mes:'Junho',entradas:350,gastos:60,saldo:3265},{mes:'Julho',entradas:60,gastos:30,saldo:3295},{mes:'Agosto',entradas:60,gastos:50,saldo:3305},{mes:'Setembro',entradas:60,gastos:110,saldo:3255},{mes:'Outubro',entradas:60,gastos:0,saldo:3315},{mes:'Novembro',entradas:50,gastos:0,saldo:3365},{mes:'Dezembro',entradas:500,gastos:120,saldo:3745}],"Dela":[{mes:'Janeiro',entradas:0,gastos:0,saldo:4010},{mes:'Fevereiro',entradas:0,gastos:0,saldo:4010},{mes:'Março',entradas:0,gastos:0,saldo:4010},{mes:'Abril',entradas:0,gastos:70,saldo:3940},{mes:'Maio',entradas:0,gastos:0,saldo:3940},{mes:'Junho',entradas:0,gastos:40,saldo:3900},{mes:'Julho',entradas:0,gastos:20,saldo:3880},{mes:'Agosto',entradas:0,gastos:50,saldo:3830},{mes:'Setembro',entradas:0,gastos:110,saldo:3720},{mes:'Outubro',entradas:0,gastos:0,saldo:3720},{mes:'Novembro',entradas:0,gastos:0,saldo:3720},{mes:'Dezembro',entradas:0,gastos:100,saldo:3620}]};

function mostrarPlaneamento(aba){
  const c=document.getElementById('tabela-planeamento');c.innerHTML='';
  if(!planeamentoData[aba]) return;
  const t=document.createElement('table');
  const h=document.createElement('tr');
  ['Mês','Entradas (€)','Gastos (€)','Saldo (€)'].forEach(v=>{
    const th=document.createElement('th');th.textContent=v;h.appendChild(th);
  });
  t.appendChild(h);
  planeamentoData[aba].forEach(m=>{
    const tr=document.createElement('tr');
    [m.mes,m.entradas,m.gastos,m.saldo].forEach(v=>{
      const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  c.appendChild(t);
}

// ================== INICIALIZAÇÃO ==================
atualizarSaldosLista();
preencherSelectAbas();
mostrarPlaneamento(document.getElementById('planeamento-aba').value);
atualizarSubAbasMensais();
</script>
</body>
</html>
